<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        /* Desain Latar Belakang */
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* Desain Kartu Ucapan */
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Teks Judul */
        h1 {
            color: #ff5e62;
            font-size: 2.5em;
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* Teks Paragraf */
        p {
            color: #555;
            font-size: 1.2em;
            line-height: 1.6;
        }

        /* Desain Tombol */
        .btn {
            background-color: #ff5e62;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 94, 98, 0.4);
        }

        .btn:hover {
            background-color: #e04a50;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 94, 98, 0.6);
        }

        /* Pesan Tersembunyi */
        .hidden-message {
            display: none;
            margin-top: 25px;
            font-size: 1.1em;
            color: #333;
            background: #fff0f0;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #ff5e62;
            animation: fadeIn 0.8s ease-in;
        }

        /* Animasi */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p>Hai <b>[Nama Temanmu]</b>,</p>
        <p>Hari ini adalah hari yang sangat spesial untukmu!</p>
        
        <button class="btn" onclick="bukaPesan()">Klik untuk Buka Hadiah 🎁</button>
        
        <div id="pesanRahasia" class="hidden-message">
            Semoga panjang umur, sehat selalu, rezekinya lancar, dan semua yang kamu cita-citakan bisa segera terwujud. Tetap jadi orang yang baik dan bahagia terus ya! 🥳💖
        </div>
    </div>

    <script>
        // Logika untuk memunculkan pesan saat tombol diklik
        function bukaPesan() {
            document.getElementById("pesanRahasia").style.display = "block";
            document.querySelector(".btn").style.display = "none";
        }
    </script>

</body>
</html>
